name: 发布

# 两种触发方式：
#   1. 推送 v* tag —— 以后的常规发布流程，全自动
#   2. 手动触发 —— 用于补发已存在的 tag（GitHub 不会为已推送的 tag 重跑 workflow）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号，需与 package.json 一致（如 0.1.2）'
        required: true
        type: string

# 创建 Release 与上传附件需要 contents: write
permissions:
  contents: write

jobs:
  release:
    # macos-14 起是 Apple Silicon runner，产物为 arm64
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 解析版本号与 tag
        id: meta
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v$VERSION"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi

          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::版本号不一致：tag 为 $VERSION，package.json 为 $PKG_VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "将发布 $TAG（package.json 版本 $PKG_VERSION）"

      - name: 类型检查
        run: npm run typecheck

      - name: 核心测试
        run: npm run test:core

      - name: 打包 arm64 安装镜像
        run: npm run dist:mac

      - name: 校验产物架构
        run: |
          APP="release/mac-arm64/Mail Master.app"
          ARCH="$(lipo -archs "$APP/Contents/MacOS/Mail Master")"
          echo "主可执行文件架构：$ARCH"
          if [ "$ARCH" != "arm64" ]; then
            echo "::error::产物不是纯 arm64，会触发 macOS 的 Intel 弃用警告"
            exit 1
          fi

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"

          # 已存在则只补传附件，避免重复发布时报错
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，补传附件"
            gh release upload "$TAG" release/*.dmg --clobber
          else
            gh release create "$TAG" release/*.dmg \
              --title "Mail Master $VERSION" \
              --generate-notes
          fi

      - name: 保留构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ steps.meta.outputs.version }}
          path: release/*.dmg
          retention-days: 7
