name: 发布

# 两种触发方式：
#   1. 推送 v* tag —— 常规发布流程，全自动
#   2. 手动触发 —— 用于补发已存在的 tag（GitHub 不会为已推送的 tag 重跑 workflow）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号，需与 package.json 一致（如 0.2.0）'
        required: true
        type: string

# 创建 Release 与上传附件需要 contents: write
permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # 最快的一道门禁：纯文件检查，几秒就能拦住锁文件源、发布参数、
      # 产物命名、必需资源、gitignore 覆盖这类问题，不用等打包跑完
      - name: 标准检查
        run: node scripts/preflight.mjs

      - name: 解析版本号与 tag
        id: meta
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v$VERSION"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi

          PKG="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::版本号不一致：tag 为 $VERSION，package.json 为 $PKG"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "将发布 $TAG（package.json 版本 $PKG）"

  build:
    needs: resolve
    # 一个平台失败不影响另一个平台继续构建，便于分别定位
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos-arm64
            build_args: '--mac --arm64 -c.mac.identity=null'
          - os: windows-latest
            artifact: windows-x64
            build_args: '--win --x64'
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 环境信息
        run: |
          node -v
          npm -v
          npx electron-builder --version
        shell: bash

      - name: 类型检查
        run: npm run typecheck

      - name: 核心测试
        run: npm run test:core

      # 构建与打包拆成两步：失败时能靠耗时判断是哪一半出问题
      - name: 构建主进程与渲染层
        run: npm run build

      - name: 打包安装包
        # --publish never 必须加：electron-builder 在 CI 里检测到 git tag 会
        # 「隐式发布」，而它需要 GH_TOKEN，未设置就直接失败。
        # 发布由后面的 publish job 统一负责。
        run: npx electron-builder ${{ matrix.build_args }} --publish never

      - name: 校验产物确实是纯 arm64（仅 macOS）
        if: matrix.os == 'macos-14'
        run: |
          APP="release/mac-arm64/Mail Master.app"
          ARCH="$(lipo -archs "$APP/Contents/MacOS/Mail Master")"
          echo "主可执行文件架构：$ARCH"
          if [ "$ARCH" != "arm64" ]; then
            echo "::error::产物不是纯 arm64，会触发 macOS 的 Intel 弃用警告"
            exit 1
          fi
        shell: bash

      - name: 列出产物
        run: ls -lh release/ || true
        shell: bash

      - name: 保留构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.blockmap
          retention-days: 7

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ needs.resolve.outputs.tag }}"
          VERSION="${{ needs.resolve.outputs.version }}"

          # 清掉旧附件：改名重发时（比如产物命名修正）旧文件会残留，
          # 新旧混在一起会让人困惑该下哪个
          echo "清理旧附件："
          gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.assets[] | "  删除 \(.name)"' |
            while IFS= read -r line; do
              echo "$line"
              ID=$(echo "$line" | grep -o '[0-9]*$')
              [ -n "$ID" ] && gh api -X DELETE "repos/$GH_REPO/releases/assets/$ID" || true
            done || true

          echo "待上传的附件："
          ls -lh dist || true

          # 已存在则重建附件，否则新建 Release
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Mail Master $VERSION" \
              --generate-notes
          fi
