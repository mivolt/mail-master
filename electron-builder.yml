appId: com.mailmaster.desktop
productName: Mail Master
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

asarUnpack:
  - resources/**

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  # 不在此处固定 arch：默认跟随构建机（Apple 芯片 → arm64）。
  # 在 Apple 芯片上运行 x64 版本会走 Rosetta，macOS 26 起会弹出
  # 「基于 Intel 的 App 支持即将结束」的警告，并提示 macOS 28 将无法运行。
  # 需要 Intel 版时用 npm run dist:mac:x64 显式构建。
  target:
    - target: dmg
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSHumanReadableCopyright: ''
    LSMinimumSystemVersion: '11.0'

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  iconSize: 128
  contents:
    - x: 150
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications

npmRebuild: false
