appId: com.mailmaster.desktop
productName: Mail Master
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

# mac 打包后、DMG 构建前做 ad-hoc 重签，保证签名进入最终产物
afterPack: scripts/after-pack-mac.cjs

files:
  - out/**/*
  - package.json

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  # 架构由调用方显式指定：本地 dist:mac / dist:mac:x64 各出一种，
  # CI 同时传 --arm64 --x64 构建两种。不要在这里固定 arch，
  # 否则 target.arch 会盖过本地命令的单架构参数。
  target: dmg
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSHumanReadableCopyright: ''
    LSMinimumSystemVersion: '11.0'

dmg:
  # 产物名不用空格：GitHub Actions 的 artifact 中转会把空格替换成点，
  # 导致发布出来的文件名与本地不一致
  artifactName: Mail-Master-${version}-${arch}.${ext}
  iconSize: 128
  contents:
    - x: 150
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications

win:
  icon: build/icon.ico
  target: nsis

nsis:
  # 不做一键安装：让用户能选安装目录，这是 Windows 桌面软件的常规预期
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Mail Master
  artifactName: Mail-Master-${version}-${arch}-setup.${ext}

linux:
  icon: build/icon.png
  category: Network;InstantMessaging
  maintainer: mivolt
  vendor: Mail Master
  description: 多账号邮件客户端，支持 IMAP / SMTP
  # 与 dmg/nsis 同理：显式命名，避免多架构产物互相覆盖
  artifactName: Mail-Master-${version}-${arch}.${ext}
  target:
    - AppImage
    - deb
    - rpm

npmRebuild: false
